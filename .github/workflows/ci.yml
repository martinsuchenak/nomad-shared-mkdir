name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n nomad-shared-mkdir

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "nomad-shared-mkdir"

  version-check:
    name: Version matches tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Compare fingerprint version to tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script_version=$(grep -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' nomad-shared-mkdir \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "tag=$tag fingerprint=$script_version"
          if [ "$tag" != "$script_version" ]; then
            echo "::error::Tag v$tag does not match fingerprint version $script_version"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate checksum
        run: sha256sum nomad-shared-mkdir > nomad-shared-mkdir.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            nomad-shared-mkdir nomad-shared-mkdir.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
